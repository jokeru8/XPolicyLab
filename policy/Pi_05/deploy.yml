# Basic experiment configuration
policy_name: Pi_05
protocol: ws
host: localhost
bench_name: null
task_name: null
env_cfg_type: null
seed: null
eval_batch: true

checkpoint_num: 59999
result_dir: "./results/pi05/"
obs_transform_pipeline: "xspark-v1.0"

# Model / action configuration
action_type: umi
action_protocol: umi_v1
use_head_camera: false
use_proprioception: true
observation_steps: 2
observation_stride: 3
action_horizon: 50
# Online evaluation executes the entire predicted UMI chunk before replanning.
# This is an inference scheduling choice; it is intentionally independent of
# the training-time protocol manifest's execute_steps field.
execute_steps: 50
policy_uv_env_path: openpi
# Must match the config used by train.sh (default OPENPI_TRAIN_CONFIG_NAME).
train_config_name: pi05_robotwin_umi
repo_id: robotwin_umi

port: 6000
