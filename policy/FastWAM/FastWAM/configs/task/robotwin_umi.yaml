# @package _global_

defaults:
  - override /data: robotwin_umi
  - override /model: fastwam
  - _self_

batch_size: 16
num_workers: 8
model:
  mot_checkpoint_mixed_attn: false
lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 16
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null

umi_spec:
  protocol: umi_v1
  state_representation: umi_current_relative_history_se3_gripper_v1
  storage_action_representation: umi_relative_se3_gripper_v1
  model_action_representation: umi_chunk_relative_se3_gripper_v1
  use_head_camera: false
  use_proprioception: false
  observation_steps: 1
  observation_stride: 1
  action_horizon: 32
  execute_steps: 24
  camera_roles: [left_wrist, right_wrist]
  action_dim: 14
  first_target_offset: 1
